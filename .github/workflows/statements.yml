# Every scanner exclusion has a published statement (#89).
#
# A scanner reports something that does not apply here, and the choices are to fix
# it, to suppress it silently, or to say publicly why it does not apply.
# `security/statements.json` is the third. This job validates that document and
# compares it against the exclusion registers this repository actually carries, in
# both directions, so a malformed edit reddens a pull request rather than a
# release, and a directive added with no statement reddens one too.
#
# The check-run name is exactly `Every scanner exclusion has a statement`, on the
# job. GitHub takes that name from the job's `name:` and falls back to the job id,
# and a ruleset matches the literal, so the name a requirement would be attached to
# is visible in this file rather than derived from it.
#
# `.github/statements/statements.sh` holds the rules and the fixtures. Every run
# proves every rule against its own violating document and its own near miss before
# it judges anything, so a rule cannot pass its fixture and refuse something else
# in the gate.
#
# The job carries no `if:` and no path filter, for the reason
# .github/workflows/build.yml already gives: GitHub creates a check run for a job
# it started and then skipped, carrying the same name a job that did the work
# would. A path filter would be wrong here for a second reason: the change this
# check exists to catch is one that narrows a scanner, and that change touches a
# scanner's configuration rather than the document it owes a statement to.
#
# Nothing here compiles. The document and the registers are tracked text, so this
# check has a verdict on a tree the compiler cannot build. `jq` is what reads the
# document and is present on the runner image; nothing is installed here.
name: statements

on:
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Deny at the workflow level and grant per job, so a job added later starts with
# nothing rather than with what this one needs.
permissions: {}

concurrency:
  # Namespaced on the workflow name rather than the bare word, for the reason
  # #178 recorded: a group string two workflows share means the run created
  # second cancels the other, and the gate that dies that way leaves a green tick
  # beside no verdict.
  group: statements-workflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  statements:
    name: Every scanner exclusion has a statement
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the document and the registers the rules read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so do not leave the token in .git/config.
          persist-credentials: false

      - name: Prove every rule bites, then apply the rule set
        run: bash .github/statements/statements.sh check
