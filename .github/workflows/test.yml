# The suite runs on a pull request, and a run that collected nothing is refused
# (#16).
#
# The check-run name is exactly `test`, on both the workflow and the job, which is
# one of the strings #26 will require on main. GitHub takes that name from the
# job's `name:` and falls back to the job id, and a ruleset matches the literal,
# so having the two agree means a rename cannot detach the requirement from the
# thing it was requiring without being visible in this file.
#
# The logic is in .github/test/test.sh rather than in this file, because the check
# owes a fixture proving that a run collecting zero tests is refused, and a
# fixture run against a second copy of the counting proves the copy. Every run
# executes those fixtures before it judges anything.
#
# The command the script runs is the one README.md and CONTRIBUTING.md give a
# contributor, not a variant of it. A gate running something else is how the
# three come apart, and nothing in this tree compares them.
#
# The job carries no `if:` and no path filter, for the reason
# .github/workflows/build.yml already gives: GitHub creates a check run for a job
# it started and then skipped, carrying the same name a job that did the work
# would.
#
# No toolchain is installed here. rust-toolchain.toml pins it and the toolchain
# manager on this runner reads that file itself (#14), so this file carries no
# version string.
#
# The suite runs inside a network namespace carrying only loopback, under the
# runner's own unprivileged user with new privileges refused by the kernel
# (#20). That is the one place `sudo` is used in this gate, it is used to enter
# a namespace and to drop straight back out of it, and nothing compiles or runs
# as root.
name: test

on:
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Deny at the workflow level and grant per job, so a job added later starts with
# nothing rather than with what this one needs.
permissions: {}

concurrency:
  # Namespaced on the workflow name rather than the bare word, for the reason
  # #178 recorded: a group string two workflows share means the run created second
  # cancels the other, and the gate that dies that way leaves a green tick beside
  # no verdict.
  group: test-workflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the tree the suite runs against

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so do not leave the token in .git/config.
          persist-credentials: false

      # The toolchain is resolved here, outside the sandbox below, because the
      # manager needs the network the first time it meets the pin and the sandbox
      # has none. This also puts the comparison from #14 on the log of the job
      # that runs the suite rather than only on the one that compiles it.
      - name: Say which toolchain runs the suite, and refuse another one
        run: bash .github/toolchain/toolchain.sh check

      # The suite runs headless, unprivileged and on loopback alone (#20).
      # `.github/headless/enter.sh` creates those three, and
      # `.github/headless/headless.sh` reads them back and refuses the run if any
      # is absent, so a sandbox that stopped being one is caught rather than
      # passed through.
      - name: Enter the required environment, prove it, then run the suite
        run: bash .github/headless/enter.sh
