[package]
# The package is not called `core`. That name is taken by the standard library's
# own crate, and a local crate carrying it makes every path that means the
# standard one ambiguous at the first `use`.
name = "flowfin-core"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "The shared core every Flowfin client uses: reaching a server, holding a session, caching, artwork, playback position and measurement."
repository = "https://github.com/Flowfin/core"
publish = false

[lib]
# The library target keeps the package name with the separator the language
# requires, so a client writes `use flowfin_core::...`.
name = "flowfin_core"

[dependencies]
# THE FIRST ENTRY HERE, AND THE COMMENT THAT SAID THERE WERE NONE IS BELOW WITH
# THE PART OF IT THAT STILL STANDS. Every entry carries the clause of
# `docs/decisions/0103-what-admits-a-dependency-and-what-is-refused.md` that
# admitted it and what would retire it, on the lines above it, because a separate
# list drifts from the graph it describes and the drift is invisible until
# somebody audits it.
#
# Admitted by: the clause for a requirement a landed record already states.
# `docs/decisions/0041-how-a-cache-key-is-built.md` requires a cryptographic
# digest used at full width, against an input the adversary partly controls, and
# `docs/decisions/0011-the-language-the-toolchain-and-the-binding-layer.md`
# measures that the toolchain offers none. 0103 names 0041 as one of the two
# records that clause was written for, so the judgement of worth was made there
# and what is left is the licence set, the four behaviours, and the smallest
# thing that meets the requirement. The licence is `MIT OR Apache-2.0` on this
# package and on all eight it reaches, both members are in 0103's admitted set,
# and none of the five outright refusals applies: it reaches no network, touches
# no filesystem, starts no thread, writes to no log, and carries no field-bearing
# surface of its own.
#
# Retired by: the toolchain offering a cryptographic digest on a stable build,
# which 0011 already names as the shape that retires this class; or 0041 being
# superseded by a record that no longer requires one. Not by "when we no longer
# need it", which 0103 refuses as a condition.
#
# `default-features = false` because `alloc` and `oid` are on by default and this
# core needs neither: nothing here boxes a digest and nothing here reads an object
# identifier. What that does not remove is `cpufeatures`, which `sha2` reaches for
# on every target to choose an implementation at run time, and which reaches
# `libc` on some of them. That is the whole of the graph and it is read rather
# than assumed:
#
#     cargo tree -e normal
#     cargo metadata --format-version 1 --locked | jq -r '.packages[] | "\(.name) \(.license)"'
sha2 = { version = "0.11", default-features = false }

# WHAT THE SENTENCE THAT STOOD HERE STILL SAYS. It said this section was empty on
# purpose and named 0103 as the rule that admits an entry. The emptiness is gone
# and the rule is not: an entry arriving here without a clause and a removal
# condition beside it is refused by nothing in this repository today, which is
# that record's own closing sentence about itself.

[dev-dependencies]
# Empty on purpose, and judged by the same record: the relaxation there is on
# what a dependency has to be worth, not on the licence set or the four
# behaviours.

# The harness for the paths a fake cannot prove (#22). `test = false` is what
# keeps it out of `cargo test --locked`, which is the command the `test` check
# runs, so nothing this target needs can make the headless suite in #20
# conditional.
#
# THIS COMMENT SAID IT WAS STILL BUILT BY `cargo build --locked --all-targets`,
# AND IT WAS NOT. That command selects the test targets carrying `test = true`,
# so it never reached this file, and a rename of a type this file names left the
# whole gate green. What compiles it now is the second step of the `build` check,
# `.github/excluded-targets/excluded-targets.sh`, which derives the set of
# excluded targets from this manifest and builds each one without running it.
# That is #201, and the measurement that found it is in the block below.
#
# `harness = false` so that an absent prerequisite and an empty case list are
# refusals with an exit code rather than skipped test cases. The default harness
# owns the process exit, and a skip under it reads as a case that was there.
#
# Running it is deliberate:
#     cargo test --locked --test needs_a_real_server_or_real_hardware
[[test]]
name = "needs_a_real_server_or_real_hardware"
path = "tests/needs_a_real_server_or_real_hardware.rs"
harness = false
test = false

# The deliberate race the detector in #117 has to report. `test = false` keeps it
# out of `cargo test --locked`, which matters more here than for the target above:
# the body of that file is undefined behaviour on purpose and a contributor
# running the ordinary suite must not execute it.
#
# `harness = false` so the file owns its own exit. The detector's report is what
# the run reads, and a test harness printing a pass beside a race report is two
# verdicts where there should be one.
#
# `cargo build --locked --all-targets` DOES NOT COMPILE THIS FILE EITHER. That
# command selects the test targets carrying `test = true`, so neither of the two
# blocks here is reached by it. Measured rather than supposed:
#
#     printf 'this is not rust and will not compile;' >> tests/needs_a_real_server_or_real_hardware.rs
#     cargo build --locked --all-targets ; echo "exit=$?"
#     exit=0
#     cargo build --locked --test needs_a_real_server_or_real_hardware ; echo "exit=$?"
#     exit=101
#
# Two things reach this target instead, and both run on every pull request.
# `.github/workflows/thread-detector.yml` builds it and runs it, and refuses a run
# of it that reports no race. The second step of the `build` check compiles it and
# every other excluded target without running any of them, off a set derived from
# this manifest, which is what covers the target above as well.
#
# Running it by hand is deliberate, and it is only meaningful under the detector:
#     cargo test --locked --test a_race_the_detector_must_catch
[[test]]
name = "a_race_the_detector_must_catch"
path = "tests/a_race_the_detector_must_catch.rs"
harness = false
test = false
