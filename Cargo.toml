[package]
# The package is not called `core`. That name is taken by the standard library's
# own crate, and a local crate carrying it makes every path that means the
# standard one ambiguous at the first `use`.
name = "flowfin-core"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "The shared core every Flowfin client uses: reaching a server, holding a session, caching, artwork, playback position and measurement."
repository = "https://github.com/Flowfin/core"
publish = false

[lib]
# The library target keeps the package name with the separator the language
# requires, so a client writes `use flowfin_core::...`.
name = "flowfin_core"

[dependencies]
# Empty on purpose. `docs/decisions/0103-what-admits-a-dependency-and-what-is-refused.md`
# is the rule that admits an entry here, and every entry carries the clause that
# admitted it and what would retire it on the line above it.

[dev-dependencies]
# Empty on purpose, and judged by the same record: the relaxation there is on
# what a dependency has to be worth, not on the licence set or the four
# behaviours.

# The harness for the paths a fake cannot prove (#22). `test = false` is what
# keeps it out of `cargo test --locked`, which is the command the `test` check
# runs, so nothing this target needs can make the headless suite in #20
# conditional. It is still built by `cargo build --locked --all-targets`, so it
# cannot rot in silence.
#
# `harness = false` so that an absent prerequisite and an empty case list are
# refusals with an exit code rather than skipped test cases. The default harness
# owns the process exit, and a skip under it reads as a case that was there.
#
# Running it is deliberate:
#     cargo test --locked --test needs_a_real_server_or_real_hardware
[[test]]
name = "needs_a_real_server_or_real_hardware"
path = "tests/needs_a_real_server_or_real_hardware.rs"
harness = false
test = false

# The deliberate race the detector in #117 has to report. `test = false` keeps it
# out of `cargo test --locked`, which matters more here than for the target above:
# the body of that file is undefined behaviour on purpose and a contributor
# running the ordinary suite must not execute it.
#
# `harness = false` so the file owns its own exit. The detector's report is what
# the run reads, and a test harness printing a pass beside a race report is two
# verdicts where there should be one.
#
# NOTHING IN THE ORDINARY GATE COMPILES THIS FILE. `--all-targets` selects the
# test targets carrying `test = true`, so neither of the two blocks here is
# reached by `cargo build --locked --all-targets`, and a file that stops
# compiling stays green on every check that command stands behind. Measured
# rather than supposed, at the commit this landed on:
#
#     printf '\nthis is not rust and will not compile;\n' >> tests/needs_a_real_server_or_real_hardware.rs
#     cargo build --locked --all-targets ; echo "exit=$?"
#     exit=0
#     cargo build --locked --test needs_a_real_server_or_real_hardware ; echo "exit=$?"
#     exit=101
#
# What keeps THIS target from rotting is the leg that runs it:
# `.github/workflows/thread-detector.yml` builds and runs it on every pull
# request and refuses a run of it that reports no race, so a file that stopped
# compiling here reddens that check. The target above has no such leg, and #22 is
# where that sits.
#
# Running it by hand is deliberate, and it is only meaningful under the detector:
#     cargo test --locked --test a_race_the_detector_must_catch
[[test]]
name = "a_race_the_detector_must_catch"
path = "tests/a_race_the_detector_must_catch.rs"
harness = false
test = false
